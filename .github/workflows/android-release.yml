name: Android Release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up JDK 25
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#android-v}"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG"
            echo "Expected format: android-vX.Y.Z"
            exit 1
          fi

          GRADLE_VERSION="$(
            sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' \
              app/build.gradle.kts |
              head -n 1
          )"

          if [[ -z "$GRADLE_VERSION" ]]; then
            echo "Unable to determine versionName from app/build.gradle.kts"
            exit 1
          fi

          if [[ "$VERSION" != "$GRADLE_VERSION" ]]; then
            echo "Tag/app version mismatch."
            echo "Tag version:    $VERSION"
            echo "Gradle version: $GRADLE_VERSION"
            exit 1
          fi

          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Release version: $VERSION"

      - name: Restore release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" ]]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/ikev2-android-release.jks"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE_PATH"

          chmod 600 "$KEYSTORE_PATH"

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build and test signed release
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          ./gradlew \
            --no-daemon \
            --no-configuration-cache \
            clean \
            testDebugUnitTest \
            lintDebug \
            assembleRelease

      - name: Prepare release artifacts
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist

          APK_NAME="ikev2-android-v${RELEASE_VERSION}.apk"

          cp \
            app/build/outputs/apk/release/app-release.apk \
            "dist/$APK_NAME"

          (
            cd dist
            sha256sum "$APK_NAME" > "$APK_NAME.sha256"
            sha256sum -c "$APK_NAME.sha256"
          )

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail

          APK="dist/ikev2-android-v${RELEASE_VERSION}.apk"

          APKSIGNER="$(
            find "${ANDROID_HOME}/build-tools" \
              -type f \
              -name apksigner \
              | sort -V \
              | tail -n 1
          )"

          if [[ -z "$APKSIGNER" || ! -x "$APKSIGNER" ]]; then
            echo "apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          APK="dist/ikev2-android-v${RELEASE_VERSION}.apk"
          CHECKSUM="${APK}.sha256"

          gh release create "${GITHUB_REF_NAME}" \
            "$APK" \
            "$CHECKSUM" \
            --title "IKEv2 Android Client v${RELEASE_VERSION}" \
            --generate-notes \
            --verify-tag

      - name: Remove temporary keystore
        if: always()
        shell: bash
        run: |
          rm -f "${ANDROID_KEYSTORE_PATH:-}"